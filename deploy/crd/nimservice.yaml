---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nimservices.modelgate.dev
spec:
  group: modelgate.dev
  scope: Namespaced
  names:
    plural: nimservices
    singular: nimservice
    kind: NIMService
    shortNames:
      - nim
      - nims
    categories:
      - modelgate
      - ai
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Enables `kubectl scale nim/<name> --replicas=N`; the operator
      # honors the pointer-typed Replicas field for explicit zero.
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      # Columns visible in `kubectl get nim`. Keep short — one glance
      # per row for daily ops.
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Image
          type: string
          jsonPath: .spec.image
          priority: 1
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  minLength: 1
                  description: >-
                    NIM container image, e.g.
                    nvcr.io/nim/meta/llama3-8b:1.0.0
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  # Nullable so the operator can distinguish "field
                  # omitted → default 1" from "explicit 0 → scale down."
                  # Pointer-typed on the Go side; nullable on the wire.
                  nullable: true
                  description: >-
                    Desired replica count. Defaults to 1 when unset.
                    Set to 0 to intentionally scale to zero.
                model:
                  type: string
                  description: >-
                    Human-friendly model identifier surfaced in status
                    and pod labels for filtering.
                ngcSecretName:
                  type: string
                  description: >-
                    Name of a Secret in the same namespace containing
                    the NGC_API_KEY. Missing values yield a Deployment
                    that will 401 on every NIM request; the operator
                    flags this via the NGCKeyPresent condition.
                gpuRequest:
                  type: integer
                  format: int32
                  minimum: 0
                  description: >-
                    Number of nvidia.com/gpu resources to request per
                    pod. Defaults to 1 when unset.
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                  description: >-
                    HTTP port the NIM container listens on. Defaults
                    to 8000. Used as the readiness-probe target.
                resources:
                  type: object
                  description: >-
                    CPU + memory requests and limits. Additive optional
                    field: unset → adapter defaults (CPU 500m + memory
                    2Gi as REQUESTS ONLY, no CPU/memory LIMITS —
                    Burstable QoS by design). Empty sub-fields keep
                    those defaults; only specified values override.
                    NOTE — this schema is hand-maintained alongside the
                    Go types in api/v1alpha1/nimservice.go; keep the
                    two in lockstep.
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: >-
                            CPU request (e.g. "500m", "2"). Empty →
                            adapter default 500m.
                        memory:
                          type: string
                          description: >-
                            Memory request (e.g. "2Gi"). Empty →
                            adapter default 2Gi.
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                          description: >-
                            CPU limit. Empty → no CPU ceiling (pod is
                            Burstable). Set only when a specific
                            workload's ceiling has been verified.
                        memory:
                          type: string
                          description: >-
                            Memory limit. Empty → no memory ceiling.
                readOnlyRootFilesystem:
                  type: boolean
                  description: >-
                    Opt-in to a read-only container root filesystem.
                    Off by default because NIM images write to caches
                    inside the image and per-image testing is required
                    to know which paths need writable mounts. When
                    true, writableMounts declares the emptyDir volumes.
                writableMounts:
                  type: array
                  items:
                    type: string
                  description: >-
                    Paths that stay writable when
                    readOnlyRootFilesystem is true. Each path becomes
                    an emptyDir volume. Default when the list is empty
                    and readOnlyRootFilesystem is on: ["/tmp"]. That
                    default is a GUESS based on the general NIM shape
                    and HAS NOT BEEN VERIFIED against a specific
                    image; NIM images commonly write elsewhere too
                    (/var/cache, /root/.cache). Document your image's
                    actual write set before relying on the default.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                readyReplicas:
                  type: integer
                  format: int32
                phase:
                  type: string
                  # Enum discipline so kubectl-get output stays clean;
                  # matches derivePhase() in the reconciler.
                  enum:
                    - Pending
                    - Progressing
                    - Ready
                    - Degraded
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      reason:
                        type: string
                      message:
                        type: string
